services:
  postgres_db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: custom_db
    ports:
      - "5433:5432" 
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: